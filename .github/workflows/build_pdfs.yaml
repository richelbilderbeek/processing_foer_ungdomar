on:
  push:
  pull_request:

name: Build PDF documents

jobs:
  build_pdf:

    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Setup pandoc
        uses: nikeee/setup-pandoc@v1

      #- name: Setup TeX Live
      #  uses: teatimeguest/setup-texlive-action@v2

      - name: Install pdflatex, from https://gist.github.com/rain1024/98dd5e2c6c8c28f9ea9d
        run: |
          sudo apt-get install texlive-latex-base
          sudo apt-get install texlive-fonts-recommended
          sudo apt-get install texlive-fonts-extra
          sudo apt-get install texlive-latex-extra

      - name: Install pdfunite
        run: sudo apt-get install poppler-utils

      - name: Install bookletimposer
        run: sudo apt-get install bookletimposer

      - name: Remove old PDFs
        run: |
          cd docs/books || exit 42
          rm *.pdf
          cd -

      - name: Create front pages
        run: |
          cd docs/scripts || exit 42
          ./create_front_pages.sh || exit 43
          cd -

      - name: Show front pages
        run: |
          cd docs/books || exit 42
          ls *.pdf
          cd -

      - name: Create books
        run: |
          cd docs/scripts || exit 42
          ./create_test_book.sh || exit 43
          ./create_book_1.sh || exit 43
          ./create_book_2.sh || exit 43
          ./create_book_3.sh || exit 43
          ./create_book_4.sh || exit 43
          ./create_book_5.sh || exit 43
          ./create_book_6.sh || exit 43
          ./create_book_7.sh || exit 43
          ./create_book_8.sh || exit 43
          ./create_book_to_install.sh || exit 43
          cd -

      - name: Show books
        run: |
          cd docs/books || exit 42
          ls *.pdf
          cd -

      - name: Zip books
        run: |
          cd docs/books || exit 42
          zip processing_foer_undomar_books.zip *.pdf
          cd -

      - name: Upload PDF to the workflow tab
        uses: actions/upload-artifact@v4
        with:
          name: processing_foer_undomar_books.zip
          path: books/processing_foer_undomar_books.zip

